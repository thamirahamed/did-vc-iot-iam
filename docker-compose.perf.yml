services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: -host 0.0.0.0
    expose:
      - "8474"
      - "18000"
      - "18001"
      - "18010"

  issuer:
    env_file:
      - .env.project
    environment:
      REVOCATION_MODE: ${REVOCATION_MODE:-accumulator}
      AUDIT_MODE: ${AUDIT_MODE:-async}
      AUDIT_ENABLED: "true"
      FABRIC_CLIENT_MODE: ${FABRIC_CLIENT_MODE:-adapter}

  verifier:
    env_file:
      - .env.project
    environment:
      REVOCATION_MODE: ${REVOCATION_MODE:-accumulator}
      AUDIT_MODE: ${AUDIT_MODE:-async}
      AUDIT_ENABLED: "true"
      FABRIC_CLIENT_MODE: ${FABRIC_CLIENT_MODE:-adapter}
      DID_CACHE_ENABLED: "true"
      DID_CACHE_TTL_SECONDS: "30"
      ACCUMULATOR_STATE_CACHE_ENABLED: "true"
      ACCUMULATOR_STATE_CACHE_TTL_SECONDS: "2"

  benchmark-agent-gateway:
    build:
      context: ./dashboard-api
    env_file:
      - .env.project
    working_dir: /workspace
    command: uvicorn scripts.benchmark_agent_server:app --host 0.0.0.0 --port 8031
    volumes:
      - .:/workspace
      - ./data/dashboard:/data/dashboard
    environment:
      ISSUER_URL: ${ISSUER_URL:-http://issuer:8000}
      VERIFIER_URL: ${DASHBOARD_VERIFIER_URL:-http://verifier:8001}
      FABRIC_ADAPTER_URL: ${FABRIC_ADAPTER_URL:-http://fabric-adapter:8010}
      BENCHMARK_OUTPUT_DIR: /data/dashboard/benchmark-agent-gateway
      BENCHMARK_DEVICE_ID: benchmark-device-01
      REVOCATION_MODE: ${REVOCATION_MODE:-accumulator}
      AUDIT_MODE: ${AUDIT_MODE:-async}
      TOXIPROXY_URL: ${TOXIPROXY_URL:-http://toxiproxy:8474}
      TOXIPROXY_ISSUER_URL: ${TOXIPROXY_ISSUER_URL:-http://toxiproxy:18000}
      TOXIPROXY_VERIFIER_URL: ${TOXIPROXY_VERIFIER_URL:-http://toxiproxy:18001}
    depends_on:
      - issuer
      - verifier
      - fabric-adapter
      - toxiproxy
    cpus: "1.0"
    mem_limit: 512m

  benchmark-agent-constrained:
    build:
      context: ./dashboard-api
    env_file:
      - .env.project
    working_dir: /workspace
