      AUDIT_MODE: ${AUDIT_MODE:-async}
      TOXIPROXY_URL: ${TOXIPROXY_URL:-http://toxiproxy:8474}
      TOXIPROXY_ISSUER_URL: ${TOXIPROXY_ISSUER_URL:-http://toxiproxy:18000}
      TOXIPROXY_VERIFIER_URL: ${TOXIPROXY_VERIFIER_URL:-http://toxiproxy:18001}
