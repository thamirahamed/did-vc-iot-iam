    volumes:
      - .:/workspace
      - ./data/dashboard:/data/dashboard
    environment:
      ISSUER_URL: ${ISSUER_URL:-http://issuer:8000}
      VERIFIER_URL: ${DASHBOARD_VERIFIER_URL:-http://verifier:8001}
      FABRIC_ADAPTER_URL: ${FABRIC_ADAPTER_URL:-http://fabric-adapter:8010}
      BENCHMARK_OUTPUT_DIR: /data/dashboard/benchmark-agent-constrained
      BENCHMARK_DEVICE_ID: benchmark-device-02
