services:
  issuer:
    build: ./issuer-service
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    environment:
      DID_REGISTRY_PATH: /app/data/did_registry.json
      REVOCATION_REGISTRY_PATH: /app/data/revocation_registry.json
      REVOCATION_MODE: ${REVOCATION_MODE:-hybrid}
      ACCUMULATOR_STORE_PATH: /app/data/accumulator/issuer_accumulator.json
      AUDIT_LOG_PATH: /app/data/audit/issuer_audit.jsonl
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_MODE: ${AUDIT_MODE:-sync}
      AUDIT_QUEUE_MAX_SIZE: ${AUDIT_QUEUE_MAX_SIZE:-1000}
      AUDIT_FLUSH_TIMEOUT_SECONDS: ${AUDIT_FLUSH_TIMEOUT_SECONDS:-10}
      AUDIT_FAIL_CLOSED: ${AUDIT_FAIL_CLOSED:-false}
      AUDIT_WRITE_TIMEOUT_SECONDS: ${AUDIT_WRITE_TIMEOUT_SECONDS:-5}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_CLI_MODE: ${FABRIC_CLI_MODE:-true}
      FABRIC_CLI_TIMEOUT_SECONDS: ${FABRIC_CLI_TIMEOUT_SECONDS:-20}
      FABRIC_PEER_MODE: ${FABRIC_PEER_MODE:-local}
      FABRIC_PEER_DOCKER_IMAGE: ${FABRIC_PEER_DOCKER_IMAGE:-hyperledger/fabric-tools:2.5.15}
      FABRIC_DOCKER_NETWORK: ${FABRIC_DOCKER_NETWORK:-fabric_test}
      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:-mychannel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:-iam}
      FABRIC_FAIL_CLOSED: ${FABRIC_FAIL_CLOSED:-true}
    volumes:
      - ./data:/app/data
  verifier:
    build: ./verifier-service
    ports:
      - "8001:8000"
    env_file:
      - ./.env.dev
    environment:
      ISSUER_URL: http://issuer:8000
      REVOCATION_MODE: ${REVOCATION_MODE:-hybrid}
      REVOCATION_FAIL_CLOSED: "true"
      DID_RESOLUTION_FAIL_CLOSED: "true"
      AUDIT_LOG_PATH: /app/data/audit/verifier_audit.jsonl
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_MODE: ${AUDIT_MODE:-sync}
      AUDIT_QUEUE_MAX_SIZE: ${AUDIT_QUEUE_MAX_SIZE:-1000}
      AUDIT_FLUSH_TIMEOUT_SECONDS: ${AUDIT_FLUSH_TIMEOUT_SECONDS:-10}
      AUDIT_FAIL_CLOSED: ${AUDIT_FAIL_CLOSED:-false}
      AUDIT_WRITE_TIMEOUT_SECONDS: ${AUDIT_WRITE_TIMEOUT_SECONDS:-5}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_CLI_MODE: ${FABRIC_CLI_MODE:-true}
      FABRIC_CLI_TIMEOUT_SECONDS: ${FABRIC_CLI_TIMEOUT_SECONDS:-20}
      FABRIC_PEER_MODE: ${FABRIC_PEER_MODE:-local}
      FABRIC_PEER_DOCKER_IMAGE: ${FABRIC_PEER_DOCKER_IMAGE:-hyperledger/fabric-tools:2.5.15}
      FABRIC_DOCKER_NETWORK: ${FABRIC_DOCKER_NETWORK:-fabric_test}
      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:-mychannel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:-iam}
      FABRIC_FAIL_CLOSED: ${FABRIC_FAIL_CLOSED:-true}
    depends_on:
      - issuer
    volumes:
      - ./data:/app/data
